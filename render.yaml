services:
  - type: web
    name: cgsi-render
    runtime: docker
    plan: free
    region: oregon
    branch: render-deploy
    dockerContext: .
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/v1/health/ready
    autoDeployTrigger: commit
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_NAME
        value: CGSI
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: cgsi-render-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: securecommerce-ee-redis
          property: connectionString
      - key: COOKIE_SECURE
        value: "true"
      - key: REPORT_STORAGE_PATH
        value: /data/reports
      - key: REPORT_EXECUTION_MODE
        value: background
      - key: AI_ENABLED
        value: "false"
      - key: DEMO_PASSWORD
        sync: false

databases:
  - name: cgsi-render-db
    plan: free
    region: oregon
    postgresMajorVersion: "17"
    databaseName: securecommerce
    user: securecommerce
    ipAllowList: []
